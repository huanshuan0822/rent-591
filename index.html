<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0e6b5c">
<title>591 店面地圖</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230e6b5c'/><path d='M32 12c-8.3 0-15 6.5-15 14.6C17 38 32 52 32 52s15-14 15-25.4C47 18.5 40.3 12 32 12z' fill='%23fff'/><circle cx='32' cy='27' r='6' fill='%230e6b5c'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<base target="_blank">
<style>
  :root {
    --bg: #f3efe8; --surface: #ffffff; --surface-2: #faf7f2; --ink: #1c1917; --ink-2: #57534e; --ink-3: #a29b93;
    --line: #e6e0d6; --line-2: #efeae2;
    --brand: #0e6b5c; --brand-2: #0b5a4d; --brand-soft: #e1efea; --on-brand: #ffffff;
    --new: #e0592a; --new-soft: #fde8de; --want: #c88a0c; --want-soft: #fbefd3; --skip: #a8a29e;
    --radius: 14px; --shadow-1: 0 1px 2px rgba(28,25,23,.05), 0 1px 1px rgba(28,25,23,.03);
    --shadow-2: 0 8px 24px rgba(28,25,23,.10), 0 2px 6px rgba(28,25,23,.06);
    --panel-w: 460px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121413; --surface: #1b1e1d; --surface-2: #202423; --ink: #ece8e2; --ink-2: #b4ada4; --ink-3: #7a746c;
      --line: #2c302e; --line-2: #262a28;
      --brand: #3cc2a8; --brand-2: #5fd3bb; --brand-soft: #173a33; --on-brand: #06201b;
      --new: #ff8a5c; --new-soft: #3d2117; --want: #f0bb4a; --want-soft: #3a2f14; --skip: #6f6a64;
      --shadow-1: none; --shadow-2: 0 8px 24px rgba(0,0,0,.45);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink); overflow-x: hidden;
    font: 15px/1.55 "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  .ico { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- 版面：桌機左名單右地圖 ---------- */
  #app { display: grid; grid-template-columns: var(--panel-w) 1fr; height: 100vh; height: 100dvh; }
  #panel { display: flex; flex-direction: column; min-height: 0; background: var(--bg); border-right: 1px solid var(--line); }
  #chrome { background: var(--surface); border-bottom: 1px solid var(--line); }
  #scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
  #mapPane { position: relative; min-height: 0; }
  #map { position: absolute; inset: 0; background: var(--surface-2); }

  /* ---------- 標題列 ---------- */
  .top { display: flex; align-items: center; gap: 12px; padding: 16px 18px 12px; }
  .logo {
    width: 40px; height: 40px; border-radius: 11px; background: var(--brand); color: var(--on-brand);
    display: grid; place-items: center; flex: none; box-shadow: 0 2px 6px rgba(14,107,92,.25);
  }
  .logo .ico { width: 22px; height: 22px; stroke-width: 2; }
  h1 { font-size: 18px; line-height: 1.25; margin: 0; font-weight: 700; letter-spacing: .02em; }
  .sub { font-size: 12.5px; color: var(--ink-3); margin-top: 1px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #22a06b; flex: none; }
  .sub.stale { color: var(--new); }
  .sub.stale .dot { background: var(--new); }

  /* ---------- 篩選 ---------- */
  #filters { padding: 4px 18px 16px; display: grid; gap: 12px; }
  .frow { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 10px; }
  .frow > .k { font-size: 12.5px; color: var(--ink-3); font-weight: 500; }
  .fctl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
  .seg { display: inline-flex; background: var(--line-2); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: none; padding: 5px 12px; border-radius: 8px; font-size: 13.5px; color: var(--ink-2); white-space: nowrap; }
  .seg button.on { background: var(--surface); color: var(--brand); font-weight: 700; box-shadow: var(--shadow-1), 0 0 0 1px var(--line); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px;
    font-size: 13.5px; white-space: nowrap; color: var(--ink-2);
  }
  .chip.on { background: var(--brand); border-color: var(--brand); color: var(--on-brand); font-weight: 500; }
  .range { display: flex; align-items: center; gap: 10px; width: 100%; }
  input[type=range] { flex: 1; accent-color: var(--brand); min-width: 0; }
  .rval { font-size: 13.5px; font-weight: 700; color: var(--brand); white-space: nowrap; }
  .rval small { font-weight: 400; color: var(--ink-3); }
  .area { display: flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--ink-3); }
  .area input {
    width: 68px; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 5px 8px; font-size: 13.5px;
  }
  select {
    border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 5px 28px 5px 10px; font-size: 13.5px;
    appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
    background-position: right 13px center, right 8px center; background-size: 5px 5px; background-repeat: no-repeat;
  }
  .switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; user-select: none; }
  .switch input { appearance: none; width: 34px; height: 20px; border-radius: 999px; background: var(--line); position: relative; margin: 0; cursor: pointer; transition: background .15s; }
  .switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
  .switch input:checked { background: var(--brand); }
  .switch input:checked::after { transform: translateX(14px); }
  .sheet-head, .sheet-done, #fsumBtn, .tabs, #sheetBackdrop { display: none; }

  /* ---------- 統計與提示 ---------- */
  .stats { display: flex; align-items: baseline; gap: 10px; padding: 14px 18px 4px; flex-wrap: wrap; }
  .stats .big { font-size: 22px; font-weight: 700; line-height: 1; }
  .stats .big small { font-size: 13px; font-weight: 500; color: var(--ink-2); margin-left: 3px; }
  .pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font-size: 12.5px; font-weight: 500; }
  .pill.new { background: var(--new-soft); color: var(--new); }
  .pill.want { background: var(--want-soft); color: var(--want); }
  .pill.muted { background: var(--line-2); color: var(--ink-2); }
  .notes { padding: 4px 18px 0; display: grid; gap: 4px; }
  .note-line { font-size: 12.5px; color: var(--ink-3); display: flex; gap: 6px; }

  /* ---------- 名單卡片 ---------- */
  #list { padding: 10px 14px 28px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-1);
    display: grid; grid-template-columns: 124px minmax(0, 1fr); gap: 14px; padding: 12px; cursor: pointer;
    transition: border-color .15s, box-shadow .15s, transform .15s;
  }
  .card:hover { box-shadow: var(--shadow-2); }
  .card.sel { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft), var(--shadow-2); }
  .card.skip { opacity: .5; }
  .media { position: relative; isolation: isolate; width: 124px; height: 100px; border-radius: 10px; overflow: hidden; background: var(--line-2); }
  .media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .media .noimg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-3); }
  .idx {
    position: absolute; top: 6px; left: 6px; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 999px;
    background: rgba(28,25,23,.72); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center;
    backdrop-filter: blur(4px);
  }
  .card.isnew .idx { background: var(--new); }
  .card.want .idx { background: var(--want); }
  .ribbon {
    position: absolute; bottom: 6px; left: 6px; background: var(--new); color: #fff; font-size: 11px; font-weight: 700;
    border-radius: 6px; padding: 1px 6px; letter-spacing: .04em;
  }
  .body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .title { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .row1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 1px; }
  .price { font-size: 19px; font-weight: 700; line-height: 1.2; color: var(--ink); }
  .price small { font-size: 12px; font-weight: 400; color: var(--ink-3); margin-left: 2px; }
  .dist { display: inline-flex; align-items: center; gap: 4px; background: var(--brand-soft); color: var(--brand); border-radius: 999px; padding: 2px 9px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .dist span { font-weight: 400; opacity: .85; }
  .dist.unknown { background: var(--line-2); color: var(--ink-3); font-weight: 500; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { font-size: 12px; background: var(--surface-2); border: 1px solid var(--line-2); color: var(--ink-2); border-radius: 6px; padding: 0 6px; }
  .tag.cat { background: var(--brand-soft); border-color: transparent; color: var(--brand); }
  .addr { font-size: 12.5px; color: var(--ink-3); display: flex; align-items: center; gap: 4px; min-width: 0; }
  .addr span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .addr .ico { width: 13px; height: 13px; }
  .note { font-size: 12.5px; color: var(--ink-2); background: var(--surface-2); border-radius: 8px; padding: 3px 8px; }
  .actions { display: flex; gap: 6px; margin-top: 5px; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--surface);
    border-radius: 9px; padding: 4px 10px; font-size: 13px; text-decoration: none; color: var(--ink-2); white-space: nowrap;
    transition: background .12s, border-color .12s;
  }
  .btn:hover { background: var(--surface-2); }
  .btn .ico { width: 15px; height: 15px; }
  .btn.on[data-mark=want] { background: var(--want-soft); border-color: var(--want); color: var(--want); font-weight: 700; }
  .btn.on[data-mark=want] .ico { fill: currentColor; }
  .btn.on[data-mark=skip] { background: var(--line-2); border-color: var(--skip); color: var(--ink); font-weight: 700; }
  .btn.ext { margin-left: auto; color: var(--brand); border-color: transparent; }
  .empty { padding: 48px 20px; text-align: center; color: var(--ink-3); line-height: 1.8; }
  .empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }

  .skeleton { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: grid; grid-template-columns: 124px 1fr; gap: 14px; }
  .skeleton i { display: block; border-radius: 6px; background: linear-gradient(90deg, var(--line-2) 0%, var(--surface-2) 50%, var(--line-2) 100%); background-size: 200% 100%; animation: shimmer 1.2s infinite linear; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* ---------- 地圖上的元件 ---------- */
  .pin {
    width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--brand);
    border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); display: grid; place-items: center; transition: transform .15s;
  }
  .pin span { transform: rotate(45deg); color: var(--on-brand); font-size: 11.5px; font-weight: 700; font-family: -apple-system, "Noto Sans TC", sans-serif; }
  .pin.isnew { background: var(--new); }
  .pin.want { background: var(--want); }
  .pin.skip { background: var(--skip); }
  .pin.sel { transform: rotate(-45deg) scale(1.3); box-shadow: 0 0 0 4px rgba(14,107,92,.25), 0 4px 10px rgba(0,0,0,.4); }
  .target { position: relative; width: 20px; height: 20px; }
  .target::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: #dc2626; border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .target::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; background: rgba(220,38,38,.25); animation: pulse 2s infinite ease-out; }
  @keyframes pulse { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
  .float { position: absolute; z-index: 500; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-2); }
  .scope { top: 14px; left: 50%; transform: translateX(-50%); padding: 6px 14px; font-size: 13px; font-weight: 500; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .scope .ico { color: #dc2626; }
  .legend { bottom: 26px; left: 14px; padding: 8px 12px; font-size: 12px; color: var(--ink-2); display: grid; gap: 3px; }
  .legend div { display: flex; align-items: center; gap: 7px; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .leaflet-container { font-family: inherit; }
  .leaflet-popup-content-wrapper { border-radius: 14px; background: var(--surface); color: var(--ink); box-shadow: var(--shadow-2); }
  .leaflet-popup-tip { background: var(--surface); }
  .leaflet-popup-content { margin: 10px; width: 250px !important; }
  .pop { display: grid; gap: 6px; font-size: 13px; line-height: 1.45; }
  .pop img { width: 100%; height: 120px; object-fit: cover; border-radius: 9px; display: block; background: var(--line-2); }
  .pop b { font-size: 14px; display: block; }
  .pop .p { font-size: 16px; font-weight: 700; }
  .pop .m { color: var(--ink-3); }
  .pop .acts { display: flex; gap: 6px; }
  .pop .btn { flex: 1; justify-content: center; }
  .leaflet-control-zoom a { background: var(--surface) !important; color: var(--ink) !important; border-color: var(--line) !important; }
  .leaflet-bar { border: 1px solid var(--line) !important; box-shadow: var(--shadow-2) !important; border-radius: 10px !important; overflow: hidden; }
  @media (prefers-color-scheme: dark) {
    .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.8); }
    .leaflet-control-attribution { background: rgba(27,30,29,.8) !important; color: var(--ink-3); }
    .leaflet-control-attribution a { color: var(--ink-2); }
  }

  #toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: #1c1917; color: #fff; padding: 10px 14px; border-radius: 12px; font-size: 14px; display: flex; gap: 14px; align-items: center;
    z-index: 2000; max-width: calc(100vw - 32px); box-shadow: var(--shadow-2); transition: opacity .2s, transform .2s;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #toast button { background: none; border: 0; color: #5eead4; font-weight: 700; padding: 0; }

  /* ---------- 手機：名單／地圖切換，篩選從下方滑出 ---------- */
  @media (max-width: 900px) {
    #app { display: block; height: auto; }
    #panel { border-right: 0; display: block; }
    #chrome { position: sticky; top: 0; z-index: 900; }
    .top { padding: 12px 16px 8px; }
    #fsumBtn {
      display: flex; align-items: center; gap: 8px; width: calc(100% - 32px); margin: 0 16px 10px; padding: 8px 12px;
      border: 1px solid var(--line); background: var(--surface-2); border-radius: 11px; font-size: 13.5px; color: var(--ink-2); text-align: left;
    }
    #fsumBtn span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #fsumBtn b { color: var(--brand); font-weight: 700; white-space: nowrap; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line-2); }
    .tabs button { border: 0; background: none; padding: 10px 0; font-size: 14px; color: var(--ink-3); display: flex; align-items: center; justify-content: center; gap: 6px; border-bottom: 2px solid transparent; }
    .tabs button.on { color: var(--brand); font-weight: 700; border-bottom-color: var(--brand); }
    #scroll { overflow: visible; }
    #list { padding: 10px 10px 32px; }
    .card { grid-template-columns: 108px minmax(0, 1fr); gap: 12px; padding: 10px; }
    .media { width: 108px; height: 96px; }
    #mapPane { display: none; height: calc(100dvh - var(--chrome-h, 150px)); }
    body.view-map #mapPane { display: block; }
    body.view-map #scroll { display: none; }
    .scope { top: 10px; font-size: 12.5px; }
    .legend { bottom: 22px; left: 10px; }

    #filters {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 1500; background: var(--surface);
      border-radius: 18px 18px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,.18); padding: 0 18px calc(18px + env(safe-area-inset-bottom));
      max-height: 85dvh; overflow-y: auto; transform: translateY(105%); transition: transform .25s ease;
    }
    body.sheet-open #filters { transform: none; }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 4px; position: sticky; top: 0; background: var(--surface); }
    .sheet-head::before { content: ""; position: absolute; top: 6px; left: 50%; width: 38px; height: 4px; border-radius: 2px; background: var(--line); transform: translateX(-50%); }
    .sheet-head b { font-size: 16px; }
    .sheet-head button { border: 0; background: none; color: var(--brand); font-size: 14px; }
    .sheet-done { display: block; width: 100%; border: 0; background: var(--brand); color: var(--on-brand); border-radius: 12px; padding: 11px; font-size: 15px; font-weight: 700; margin-top: 4px; }
    #sheetBackdrop { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 1400; opacity: 0; pointer-events: none; transition: opacity .2s; }
    body.sheet-open #sheetBackdrop { opacity: 1; pointer-events: auto; }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <div id="chrome">
      <div class="top">
        <div class="logo"><svg class="ico" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11A6.5 6.5 0 0 1 18.5 10c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg></div>
        <div style="min-width:0">
          <h1>591 店面地圖</h1>
          <div class="sub" id="updated">讀取中…</div>
        </div>
      </div>
      <button id="fsumBtn">
        <svg class="ico" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        <span id="fsum"></span><b>篩選</b>
      </button>
      <div class="tabs" id="tabs">
        <button data-v="list" class="on"><svg class="ico" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>名單 <span id="tabCount" class="num"></span></button>
        <button data-v="map"><svg class="ico" viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>地圖</button>
      </div>
      <section id="filters">
        <div class="sheet-head"><b>篩選條件</b><button id="resetBtn">恢復預設</button></div>
        <div class="frow"><span class="k">範圍</span>
          <div class="fctl"><div class="seg" id="mode">
            <button data-v="radius">定點半徑</button><button data-v="qingguang">晴光附近</button><button data-v="all">全部</button>
          </div></div>
        </div>
        <div class="frow" id="radiusRow"><span class="k">半徑</span>
          <div class="range"><input type="range" id="radius" min="100" max="2000" step="50"><span class="rval" id="radiusVal"></span></div>
        </div>
        <div class="frow"><span class="k">月租</span><div class="chips" id="prices"></div></div>
        <div class="frow"><span class="k">坪數</span>
          <div class="area"><input type="number" id="minArea" min="0" inputmode="numeric" placeholder="不限"> ～ <input type="number" id="maxArea" min="0" inputmode="numeric" placeholder="不限"> 坪</div>
        </div>
        <div class="frow"><span class="k">類別</span><div class="chips" id="cats"></div></div>
        <div class="frow"><span class="k">顯示</span>
          <div class="fctl">
            <div class="seg" id="show"><button data-v="all">全部</button><button data-v="want">想約看</button><button data-v="new">新物件</button></div>
            <label class="switch"><input type="checkbox" id="showSkip">含不考慮</label>
          </div>
        </div>
        <div class="frow"><span class="k">排序</span>
          <div class="fctl"><select id="sort">
            <option value="distance">距離近 → 遠</option><option value="newest">最新出現</option>
            <option value="price_asc">價格低 → 高</option><option value="price_desc">價格高 → 低</option>
            <option value="area_asc">坪數小 → 大</option><option value="area_desc">坪數大 → 小</option>
          </select></div>
        </div>
        <button class="sheet-done" id="sheetDone">查看結果</button>
      </section>
    </div>
    <div id="scroll">
      <div class="stats" id="stats"></div>
      <div class="notes" id="notes"></div>
      <div id="list">
        <div class="skeleton"><i style="height:100px"></i><div style="display:grid;gap:8px"><i style="height:16px;width:85%"></i><i style="height:20px;width:40%"></i><i style="height:12px;width:65%"></i></div></div>
        <div class="skeleton"><i style="height:100px"></i><div style="display:grid;gap:8px"><i style="height:16px;width:75%"></i><i style="height:20px;width:35%"></i><i style="height:12px;width:55%"></i></div></div>
        <div class="skeleton"><i style="height:100px"></i><div style="display:grid;gap:8px"><i style="height:16px;width:80%"></i><i style="height:20px;width:45%"></i><i style="height:12px;width:60%"></i></div></div>
      </div>
    </div>
  </aside>
  <main id="mapPane">
    <div id="map"></div>
    <div class="float scope" id="scope" hidden></div>
    <div class="float legend">
      <div><i style="background:#dc2626"></i>定點</div>
      <div><i style="background:var(--brand)"></i>物件</div>
      <div><i style="background:var(--new)"></i>新物件</div>
      <div><i style="background:var(--want)"></i>想約看</div>
    </div>
  </main>
</div>
<div id="sheetBackdrop"></div>
<div id="toast"><span id="toastText"></span><button id="toastUndo">復原</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// 連結格式：https://<帳號>.github.io/<repo>/#k=網頁密鑰&s=GAS部署代號（放在 # 後面，不會送到 GitHub）。
// 資料與標記都存在 GAS（rent591-linebot/gas/Code.gs 的 doGet／handleMark_），這裡只有畫面。
// 用完整連結開過一次就記在這台瀏覽器，之後直接開網址也能用
const LINK_KEY = 'rent591.link';
const HASH = new URLSearchParams(location.hash.slice(1));
let link = { k: HASH.get('k'), s: HASH.get('s') };
try {
  if (link.k && link.s) localStorage.setItem(LINK_KEY, JSON.stringify(link));
  else link = JSON.parse(localStorage.getItem(LINK_KEY) || '{}');
} catch (e) {}
const KEY = link.k;
const API = /^[\w-]+$/.test(link.s || '') ? `https://script.google.com/macros/s/${link.s}/exec` : '';
const FIRST_TIME = '第一次使用請在 LINE 傳「網頁」，用拿到的完整連結開啟一次，<br>之後這台手機／電腦直接開這個網址就可以';

const ICON = {
  star: '<svg class="ico" viewBox="0 0 24 24"><path d="M12 3.6l2.6 5.2 5.8.9-4.2 4.1 1 5.7L12 16.8l-5.2 2.7 1-5.7-4.2-4.1 5.8-.9z"/></svg>',
  ban: '<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M6.2 6.2l11.6 11.6"/></svg>',
  ext: '<svg class="ico" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  pin: '<svg class="ico" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11A6.5 6.5 0 0 1 18.5 10c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>',
  info: '<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></svg>',
  img: '<svg class="ico" viewBox="0 0 24 24" style="width:26px;height:26px"><rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M20.5 16l-5-5-8 8"/></svg>',
  list: '<svg class="ico" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>',
};

function fatal(msg, title) {
  document.getElementById('updated').textContent = '';
  document.getElementById('list').innerHTML = `<div class="empty"><b>${title || '無法顯示'}</b>${msg}</div>`;
}

async function boot() {
  if (!KEY || !API) return fatal(FIRST_TIME, '歡迎使用');
  let res;
  try {
    res = await (await fetch(`${API}?k=${encodeURIComponent(KEY)}`)).json();
  } catch (e) {
    return fatal('請稍後再試（' + e.message + '）', '讀取資料失敗');
  }
  if (res.error === '找不到頁面') {   // 密鑰換過了：清掉記住的舊連結
    try { localStorage.removeItem(LINK_KEY); } catch (e) {}
    return fatal(FIRST_TIME, '連結已失效');
  }
  if (!res.ok) return fatal(res.error, '讀取資料失敗');
  start(res);
}

function start(BOOT) {
  const DATA = BOOT.data || { items: [], sections: [], updated: 0 };
  const SET = BOOT.settings || {};
  const POINT = SET.point || { name: '台北', lat: 25.0565, lng: 121.5246 };
  const CATS = ['店面', '辦公', '住辦'];
  const PRICES = [0, 30000, 50000, 80000, 100000, 150000, 200000];
  const NEW_MS = 24 * 3600 * 1000;
  const STORE_KEY = 'rent591.filters';
  const mobile = () => window.innerWidth <= 900;
  let marks = BOOT.marks || {};
  let selected = null;

  // ---------- 小工具 ----------
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const num = s => { const n = parseFloat(String(s || '').replace(/[,坪]/g, '')); return isNaN(n) ? null : n; };
  const walk = d => Math.max(1, Math.round(d * 1.3 / 80));   // 跟 bot.py 一樣：繞路係數 1.3、每分鐘 80 公尺
  const fmtWan = n => (n % 10000 ? (n / 10000).toFixed(1) : n / 10000) + ' 萬';
  function distance(lat, lng) {
    const r = x => x * Math.PI / 180;
    const h = Math.sin(r(lat - POINT.lat) / 2) ** 2 + Math.cos(r(POINT.lat)) * Math.cos(r(lat)) * Math.sin(r(lng - POINT.lng) / 2) ** 2;
    return Math.round(6371000 * 2 * Math.asin(Math.sqrt(h)));
  }
  const isNew = it => it.ts && Date.now() - it.ts * 1000 < NEW_MS;
  const markOf = it => (marks[it.id] || {}).m || '';
  const byId = id => DATA.items.find(x => x.id === id);

  DATA.items.forEach(it => {
    it.dist = it.lat != null ? distance(it.lat, it.lng) : null;
    it.p = num(it.price);
    it.a = num(it.area);
  });

  // ---------- 篩選狀態（預設跟 LINE 上的設定一樣；在網頁改的只記在這台瀏覽器）----------
  const defaults = {
    mode: SET.mode === 'qingguang' ? 'qingguang' : 'radius', radius: SET.radius || 800,
    maxPrice: SET.max_price || 0, minArea: SET.min_area || '', maxArea: SET.max_area || '',
    cats: CATS.slice(), show: 'all', showSkip: false, sort: SET.sort || 'distance',
  };
  let state = Object.assign({}, defaults);
  try { Object.assign(state, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch (e) {}
  function saveState() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

  function visible(it) {
    if (!basicOk(it)) return false;
    if (state.mode === 'radius') return it.dist != null && it.dist <= state.radius;
    if (state.mode === 'qingguang') return !!it.qg;
    return true;
  }

  /** 範圍以外的條件：類別、價格、坪數、標記。 */
  function basicOk(it) {
    if (!state.cats.includes(it.category)) return false;
    if (state.maxPrice && it.p && it.p > state.maxPrice) return false;
    if (state.minArea && it.a && it.a < +state.minArea) return false;
    if (state.maxArea && it.a && it.a > +state.maxArea) return false;
    const m = markOf(it);
    if (m === 'skip' && !state.showSkip) return false;
    if (state.show === 'want' && m !== 'want') return false;
    if (state.show === 'new' && !isNew(it)) return false;
    return true;
  }

  const SORTS = {
    distance: it => it.dist, newest: it => -it.ts, price_asc: it => it.p, price_desc: it => it.p == null ? null : -it.p,
    area_asc: it => it.a, area_desc: it => it.a == null ? null : -it.a,
  };
  function sorted(items) {
    const key = SORTS[state.sort] || SORTS.distance;
    // 取不到值的排最後；同值時近的在前
    return items.slice().sort((x, y) => {
      const a = key(x), b = key(y);
      if (a == null || b == null) return (a == null) - (b == null);
      return a - b || (x.dist == null) - (y.dist == null) || (x.dist || 0) - (y.dist || 0);
    });
  }

  // ---------- 地圖 ----------
  const map = L.map('map', { zoomControl: false, zoomSnap: 0.25, zoomDelta: 0.5 }).setView([POINT.lat, POINT.lng], 15);
  L.control.zoom({ position: 'topright' }).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }).addTo(map);
  L.marker([POINT.lat, POINT.lng], { icon: L.divIcon({ className: '', html: '<div class="target"></div>', iconSize: [20, 20] }), zIndexOffset: 1000 })
    .addTo(map).bindPopup(`<div class="pop"><b>${esc(POINT.name)}</b><span class="m">定點，距離從這裡算</span></div>`);
  const circle = L.circle([POINT.lat, POINT.lng], {
    radius: state.radius, color: getComputedStyle(document.documentElement).getPropertyValue('--brand').trim() || '#0e6b5c',
    weight: 2, dashArray: '6 6', fillOpacity: 0.05,
  }).addTo(map);
  const layer = L.layerGroup().addTo(map);
  const markers = {};
  let fitted = false;

  function pinClass(it) {
    const m = markOf(it);
    return ['pin', m, !m && isNew(it) ? 'isnew' : '', selected === it.id ? 'sel' : ''].filter(Boolean).join(' ');
  }

  function popupHtml(it) {
    return `<div class="pop">
      ${it.img ? `<img src="${esc(it.img)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}
      <div><b>${esc(it.title)}</b></div>
      <div><span class="p num">${it.price ? esc(it.price) : '價格未標'}</span>${it.price ? ' <span class="m">元/月</span>' : ''}</div>
      <div class="m">${[it.area, it.floor, it.dist != null ? `${it.dist}m・步行 ${walk(it.dist)} 分` : ''].filter(Boolean).map(esc).join('・')}</div>
      <div class="acts">
        <button class="btn pop-list" data-id="${it.id}">${ICON.list}在名單看</button>
        <a class="btn ext" href="${esc(it.url)}" style="margin:0">591 ${ICON.ext}</a>
      </div>
    </div>`;
  }

  // ---------- 名單 ----------
  function card(it, i) {
    const m = markOf(it);
    const isN = isNew(it);
    const dist = it.dist != null
      ? `<span class="dist num">${it.dist}m <span>· 步行 ${walk(it.dist)} 分</span></span>`
      : `<span class="dist unknown">距離不明</span>`;
    const tags = [
      it.category !== '店面' ? `<span class="tag cat">${esc(it.category)}</span>` : '',
      ...[it.area, it.floor, it.shop_type].filter(Boolean).map(t => `<span class="tag">${esc(t)}</span>`),
      it.mrt ? `<span class="tag">距${esc(it.mrt)} ${it.mrt_m}m</span>` : '',
    ].join('');
    const notes = [it.repost, it.flag, state.mode === 'qingguang' && it.qg ? `列入原因：${it.qg}` : '',
                   it.lat == null && it.category === '住辦' ? '591 住辦頁面沒有座標，無法標在地圖上' : '']
      .filter(Boolean).map(n => `<div class="note">${esc(n)}</div>`).join('');
    return `<article class="card ${m} ${!m && isN ? 'isnew' : ''} ${selected === it.id ? 'sel' : ''}" data-id="${it.id}">
      <div class="media">
        ${it.img ? `<img src="${esc(it.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}
        <div class="noimg" ${it.img ? 'style="z-index:-1"' : ''}>${ICON.img}</div>
        <div class="idx num">${i + 1}</div>
        ${isN ? '<div class="ribbon">NEW</div>' : ''}
      </div>
      <div class="body">
        <h3 class="title">${esc(it.title)}</h3>
        <div class="row1">
          <div class="price num">${it.price ? esc(it.price) + '<small>元/月</small>' : '<small>價格未標</small>'}</div>
          ${dist}
        </div>
        <div class="tags">${tags}</div>
        <div class="addr">${ICON.pin}<span>${esc(it.address)}</span></div>
        ${notes}
        <div class="actions">
          <button class="btn ${m === 'want' ? 'on' : ''}" data-mark="want">${ICON.star}想約看</button>
          <button class="btn ${m === 'skip' ? 'on' : ''}" data-mark="skip">${ICON.ban}不考慮</button>
          <a class="btn ext" href="${esc(it.url)}">591 ${ICON.ext}</a>
        </div>
      </div>
    </article>`;
  }

  function summaryText() {
    const parts = [state.mode === 'radius' ? `半徑 ${state.radius}m` : state.mode === 'qingguang' ? '晴光附近' : '全部範圍'];
    parts.push(state.maxPrice ? fmtWan(state.maxPrice) + '以下' : '月租不限');
    parts.push(state.minArea || state.maxArea ? `${state.minArea || 0}～${state.maxArea || '∞'} 坪` : '坪數不限');
    if (state.cats.length < CATS.length) parts.push(state.cats.join('、') || '無類別');
    if (state.show === 'want') parts.push('只看想約看');
    if (state.show === 'new') parts.push('只看新物件');
    return parts.join('・');
  }

  function render() {
    const shown = sorted(DATA.items.filter(visible));
    $('fsum').textContent = summaryText();
    $('tabCount').textContent = shown.length;
    const nWant = shown.filter(it => markOf(it) === 'want').length;
    const nNew = shown.filter(isNew).length;
    $('stats').innerHTML = `<span class="big num">${shown.length}<small>筆符合</small></span>` +
      (nNew ? `<span class="pill new">NEW ${nNew}</span>` : '') +
      (nWant ? `<span class="pill want">${ICON.star.replace('class="ico"', 'class="ico" style="width:13px;height:13px;fill:currentColor"')}${nWant}</span>` : '');
    const notes = [];
    if (state.mode === 'radius') {
      const noCoord = DATA.items.filter(it => it.lat == null && basicOk(it));
      const nHome = noCoord.filter(it => it.category === '住辦').length;
      if (nHome) notes.push(`另有 ${nHome} 筆住辦 591 沒提供座標，切到「全部」才看得到`);
      if (noCoord.length > nHome) notes.push(`另有 ${noCoord.length - nHome} 筆座標還在建立中，切到「全部」才看得到`);
    }
    const skipped = DATA.items.filter(it => markOf(it) === 'skip').length;
    if (skipped && !state.showSkip) notes.push(`已隱藏 ${skipped} 筆不考慮的物件`);
    $('notes').innerHTML = notes.map(n => `<div class="note-line">${ICON.info}<span>${esc(n)}</span></div>`).join('');

    $('list').innerHTML = shown.length ? shown.map(card).join('')
      : `<div class="empty"><b>${DATA.items.length ? '沒有符合條件的物件' : '還沒有資料'}</b>${DATA.items.length ? '放寬篩選條件試試看' : '等下一次爬完（或在 LINE 傳「查詢」）就會有'}</div>`;

    layer.clearLayers();
    Object.keys(markers).forEach(k => delete markers[k]);
    shown.forEach((it, i) => {
      if (it.lat == null) return;
      const mk = L.marker([it.lat, it.lng], {
        icon: L.divIcon({ className: '', html: `<div class="${pinClass(it)}"><span>${i + 1}</span></div>`, iconSize: [30, 30], iconAnchor: [15, 34], popupAnchor: [0, -30] }),
        zIndexOffset: selected === it.id ? 900 : markOf(it) === 'want' ? 500 : isNew(it) ? 300 : 0,
      }).bindPopup(popupHtml(it), { maxWidth: 270, minWidth: 250 });
      mk.on('click', () => select(it.id, false));
      markers[it.id] = mk;
      layer.addLayer(mk);
    });
    circle.setRadius(state.radius);
    if (state.mode === 'radius') circle.addTo(map); else circle.remove();
    $('scope').hidden = false;
    $('scope').innerHTML = `${ICON.pin}${esc(POINT.name)}${state.mode === 'radius' ? `・半徑 ${state.radius}m` : state.mode === 'qingguang' ? '・晴光附近' : ''}`;
    fitOnce();
  }

  // 第一次看得到地圖時把半徑範圍整個框進來（手機一開始地圖是隱藏的，大小為 0，要等切到地圖再框）
  function fitOnce() {
    if (fitted || state.mode !== 'radius' || !map.getSize().x) return;
    map.fitBounds(circle.getBounds(), { padding: [20, 20] });
    fitted = true;
  }

  function setView(v) {
    document.body.classList.toggle('view-map', v === 'map');
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
    if (v === 'map') setTimeout(() => { map.invalidateSize(); fitOnce(); }, 50);
    window.scrollTo({ top: 0 });
  }

  function select(id, fromList) {
    selected = id;
    document.querySelectorAll('.card.sel').forEach(el => el.classList.remove('sel'));
    const el = document.querySelector(`.card[data-id="${id}"]`);
    if (el) {
      el.classList.add('sel');
      if (!fromList && !mobile()) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    document.querySelectorAll('.pin.sel').forEach(p => p.classList.remove('sel'));
    const it = byId(id);
    const mk = markers[id];
    if (mk) mk.getElement() && mk.getElement().querySelector('.pin').classList.add('sel');
    if (fromList && mk && it) {
      if (mobile()) setView('map');
      setTimeout(() => {
        map.setView([it.lat, it.lng], Math.max(map.getZoom(), 17));
        mk.openPopup();
      }, mobile() ? 80 : 0);
    }
  }

  // 地圖彈出卡片的「在名單看」
  $('map').addEventListener('click', e => {
    const b = e.target.closest('.pop-list');
    if (!b) return;
    e.preventDefault();
    if (mobile()) setView('list');
    const el = document.querySelector(`.card[data-id="${b.dataset.id}"]`);
    if (el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 60);
  });

  // ---------- 標記 ----------
  let undoFn = null, toastTimer = null;
  function toast(text, undo) {
    $('toastText').textContent = text;
    $('toastUndo').style.display = undo ? '' : 'none';
    undoFn = undo;
    $('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $('toast').classList.remove('show'), 5000);
  }
  $('toastUndo').onclick = () => { $('toast').classList.remove('show'); if (undoFn) undoFn(); };

  function setMark(id, mark) {
    const before = marks[id];
    if (mark) marks[id] = { m: mark, t: Date.now() }; else delete marks[id];
    render();
    // text/plain 是「簡單請求」，瀏覽器不會先送 OPTIONS 預檢（GAS 不處理 OPTIONS）
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                 body: JSON.stringify({ action: 'mark', key: KEY, id, mark }) })
      .then(r => r.json())
      .then(r => {
        if (!r.ok) throw new Error(r.error);
        marks = r.marks; render();
      })
      .catch(err => {
        if (before) marks[id] = before; else delete marks[id];
        render();
        toast('儲存失敗：' + err.message);
      });
    const undo = () => setMark(id, before ? before.m : '');
    if (mark === 'skip') toast('已標為不考慮，LINE 名單也不再列出', undo);
    else if (mark === 'want') toast('已加入想約看', undo);
    else toast('已取消標記', undo);
  }

  $('list').addEventListener('click', e => {
    const c = e.target.closest('.card');
    if (!c) return;
    const btn = e.target.closest('button[data-mark]');
    if (btn) {
      setMark(c.dataset.id, markOf(byId(c.dataset.id)) === btn.dataset.mark ? '' : btn.dataset.mark);
      return;
    }
    if (e.target.closest('a')) return;
    select(c.dataset.id, true);
  });

  // ---------- 篩選控制項 ----------
  function bindSeg(id, key) {
    const box = $(id);
    const sync = () => box.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === state[key]));
    box.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      state[key] = b.dataset.v;
      sync(); changed();
    });
    sync();
    return sync;
  }
  function changed() {
    $('radiusRow').style.display = state.mode === 'radius' ? '' : 'none';
    $('radiusVal').innerHTML = `${state.radius}m <small>步行 ${walk(state.radius)} 分</small>`;
    saveState(); render();
  }
  const syncMode = bindSeg('mode', 'mode');
  const syncShow = bindSeg('show', 'show');
  $('radius').oninput = e => { state.radius = +e.target.value; changed(); };
  $('minArea').oninput = e => { state.minArea = e.target.value; changed(); };
  $('maxArea').oninput = e => { state.maxArea = e.target.value; changed(); };
  $('showSkip').onchange = e => { state.showSkip = e.target.checked; changed(); };
  $('sort').onchange = e => { state.sort = e.target.value; changed(); };

  function syncPrices() {
    const list = PRICES.includes(+state.maxPrice) ? PRICES : PRICES.concat(+state.maxPrice).sort((a, b) => (a || 1e9) - (b || 1e9));
    $('prices').innerHTML = list.map(p => `<button class="chip ${+state.maxPrice === p ? 'on' : ''}" data-p="${p}">${p ? fmtWan(p) + '以下' : '不限'}</button>`).join('');
  }
  $('prices').addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if (!b) return;
    state.maxPrice = +b.dataset.p;
    syncPrices(); changed();
  });
  $('cats').innerHTML = CATS.map(c => `<button class="chip" data-c="${c}">${c}</button>`).join('');
  const syncCats = () => document.querySelectorAll('#cats .chip').forEach(b => b.classList.toggle('on', state.cats.includes(b.dataset.c)));
  $('cats').addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if (!b) return;
    const c = b.dataset.c;
    state.cats = state.cats.includes(c) ? state.cats.filter(x => x !== c) : state.cats.concat(c);
    syncCats(); changed();
  });
  function syncAll() {
    syncMode(); syncShow(); syncPrices(); syncCats();
    $('radius').value = state.radius;
    $('minArea').value = state.minArea; $('maxArea').value = state.maxArea;
    $('showSkip').checked = state.showSkip;
    $('sort').value = state.sort;
  }
  $('resetBtn').onclick = () => { state = Object.assign({}, defaults, { cats: CATS.slice() }); syncAll(); changed(); };

  // 手機：篩選面板、名單／地圖切換
  const openSheet = open => document.body.classList.toggle('sheet-open', open);
  $('fsumBtn').onclick = () => openSheet(true);
  $('sheetDone').onclick = () => openSheet(false);
  $('sheetBackdrop').onclick = () => openSheet(false);
  $('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setView(b.dataset.v); });
  const measure = () => document.documentElement.style.setProperty('--chrome-h', $('chrome').offsetHeight + 'px');
  window.addEventListener('resize', () => { measure(); map.invalidateSize(); });

  // ---------- 更新時間 ----------
  if (DATA.updated) {
    const d = new Date(DATA.updated * 1000);
    const pad = n => String(n).padStart(2, '0');
    const hours = (Date.now() - d) / 3600000;
    $('updated').innerHTML = `<i class="dot"></i>${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())} 更新・` +
      `${esc(DATA.sections.join('、'))} ${DATA.items.length} 筆` + (hours > 6 ? '・超過 6 小時沒更新' : '');
    $('updated').classList.toggle('stale', hours > 6);
  } else {
    $('updated').textContent = '還沒有資料';
  }

  syncAll();
  changed();
  measure();
  setTimeout(() => map.invalidateSize(), 200);
}

boot();
</script>
</body>
</html>
